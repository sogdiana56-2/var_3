<!DOCTYPE html>
<html lang="ru">
<head>

    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Увидимся там</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

<div class="grain"></div>

<button class="music-button" id="musicButton" type="button">
    ♫
</button>

<main class="page date-page">

    <div class="top-line">
        <span>THE DATE</span>
        <span>03 / 03</span>
    </div>

    <section class="date-hero">

        <p class="small-text">
            Тогда договорились.
        </p>

        <h1>
            Увидимся<br>
            там.
        </h1>

        <p class="date-description">
            Я всё продумал.<br>
            Тебе остаётся только красиво прийти.
        </p>

    </section>

    <section class="date-info">

        <div class="info-card">

            <span>DATE</span>

            <strong>
                25 ОКТЯБРЯ
            </strong>

        </div>

        <div class="info-card">

            <span>TIME</span>

            <strong>
                19:00
            </strong>

        </div>

        <div class="info-card">

            <span>PLACE</span>

            <strong>
                Название места
            </strong>

        </div>

    </section>

    <section class="countdown-section">

        <p>До нашей встречи</p>

        <div class="countdown">

            <div>
                <strong id="days">00</strong>
                <span>дней</span>
            </div>

            <div>
                <strong id="hours">00</strong>
                <span>часов</span>
            </div>

            <div>
                <strong id="minutes">00</strong>
                <span>минут</span>
            </div>

            <div>
                <strong id="seconds">00</strong>
                <span>секунд</span>
            </div>

        </div>

    </section>

    <a
        href="https://2gis.kg/"
        target="_blank"
        class="main-button map-button">

        Открыть маршрут ↗

    </a>

    <p class="final-text">
        Просто приходи.<br>
        Остальное я беру на себя.
    </p>

</main>

<audio id="music" loop>
    <source src="нужна.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>

</body>
</html>
