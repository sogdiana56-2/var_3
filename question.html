<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Один вопрос</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="light-page">

<div class="light-decoration"></div>

<main class="page question-page">

    <div class="top-line">
        <span>ONE QUESTION</span>
        <span>02 / 03</span>
    </div>


    <section class="question-content">

        <div class="question-number">
            02
        </div>

        <p class="small-text">
            Теперь серьёзно.
        </p>

        <h1>
            Пойдёшь<br>
            со мной<br>
            на свидание<span>?</span>
        </h1>

        <div class="red-line"></div>

        <p class="question-description">
            Место уже выбрано.<br>
            День уже выбран.<br>
            Осталось только твоё решение.
        </p>

    </section>


    <section class="answers-area" id="answersArea">

        <a href="date.html"
           class="answer-button yes-button"
           id="yesButton">

            Да. Я иду →

        </a>


        <button
            class="answer-button no-button"
            id="noButton"
            type="button">

            Нет

        </button>

    </section>


    <p class="no-message" id="noMessage"></p>

</main>

<script src="script.js"></script>

</body>
</html>
