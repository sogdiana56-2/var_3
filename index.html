<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Для тебя</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<div class="grain"></div>

<button class="music-button" id="musicButton" type="button">
    ♫
</button>

<main class="page first-page">

    <div class="top-line">
        <span>FOR YOU</span>
        <span>01 / 03</span>
    </div>

    <section class="hero">

        <p class="small-text">Я кое-что придумал.</p>

        <h1>
            Ты.<br>
            Я.<br>
            Вечер.
        </h1>

        <p class="description">
            Я мог бы просто написать тебе:<br>
            «Пойдём куда-нибудь?»
        </p>

        <p class="description second">
            Но зачем делать как все?
        </p>

    </section>

    <section class="album">

        <div class="photo photo-one">
            <img src="1.jpg" alt="">
        </div>

        <div class="photo photo-two">
            <img src="2.jpg" alt="">
        </div>

        <div class="photo photo-three">
            <img src="3.jpg" alt="">
        </div>

        <div class="photo photo-four">
            <img src="4.jpg" alt="">
        </div>

    </section>

    <section class="letter">

        <p class="label">И поэтому...</p>

        <h2>
            Я сделал<br>
            это немного<br>
            интереснее.
        </h2>

        <p>
            Листай дальше.
        </p>

    </section>

    <a href="question.html"
       class="main-button"
       id="continueButton">

        Продолжить →

    </a>

</main>

<audio id="music" loop>
    <source src="нужна.mp3" type="audio/mpeg">
</audio>

<script src="script.js"></script>

</body>
</html>
